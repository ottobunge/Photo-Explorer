version: '3'

vars:
  PNPM: pnpm

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ===================
  # Development
  # ===================

  dev:
    desc: Start development server
    cmds:
      - "{{.PNPM}} dev"

  dev:host:
    desc: Start dev server accessible on network
    cmds:
      - "{{.PNPM}} dev -- --host 0.0.0.0"

  build:
    desc: Build for production
    cmds:
      - "{{.PNPM}} build"

  preview:
    desc: Preview production build
    cmds:
      - "{{.PNPM}} preview"

  # ===================
  # Setup
  # ===================

  setup:
    desc: Install dependencies
    cmds:
      - "{{.PNPM}} install"

  install:
    desc: Install dependencies
    cmds:
      - "{{.PNPM}} install"

  # ===================
  # Testing
  # ===================

  test:
    desc: Run unit and component tests
    cmds:
      - "{{.PNPM}} test"

  test:unit:
    desc: Run unit tests only
    cmds:
      - "{{.PNPM}} test:unit"

  test:watch:
    desc: Run tests in watch mode
    cmds:
      - "{{.PNPM}} test -- --watch"

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - "{{.PNPM}} test -- --coverage"

  test:e2e:
    desc: Run end-to-end tests
    cmds:
      - "{{.PNPM}} test:e2e"

  test:e2e:ui:
    desc: Run E2E tests with UI
    cmds:
      - "{{.PNPM}} test:e2e -- --ui"

  test:e2e:headed:
    desc: Run E2E tests in headed mode
    cmds:
      - "{{.PNPM}} test:e2e -- --headed"

  # ===================
  # Code Quality
  # ===================

  lint:
    desc: Run linter
    cmds:
      - "{{.PNPM}} lint"

  lint:fix:
    desc: Fix linting issues
    cmds:
      - "{{.PNPM}} lint -- --fix"

  format:
    desc: Format code with Prettier
    cmds:
      - "{{.PNPM}} format"

  format:check:
    desc: Check code formatting
    cmds:
      - "{{.PNPM}} format:check"

  typecheck:
    desc: Run TypeScript type checking
    cmds:
      - "{{.PNPM}} check"

  check:
    desc: Run all code quality checks
    cmds:
      - task: lint
      - task: format:check
      - task: typecheck
      - task: test

  # ===================
  # Utilities
  # ===================

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf .svelte-kit
      - rm -rf build
      - rm -rf node_modules/.vite
      - rm -rf coverage

  sync:
    desc: Sync SvelteKit types
    cmds:
      - "{{.PNPM}} exec svelte-kit sync"
