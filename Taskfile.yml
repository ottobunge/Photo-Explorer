version: '3'

vars:
  DOCKER_COMPOSE: podman-compose
  DOCKER: podman

includes:
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend
  frontend:
    taskfile: ./frontend/Taskfile.yml
    dir: ./frontend

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ===================
  # Development
  # ===================

  dev:
    desc: Start all services in development mode
    deps: [services:up]
    cmds:
      - task: dev:parallel

  dev:parallel:
    desc: Run backend and frontend in parallel
    deps:
      - backend:dev
      - frontend:dev

  dev:local:
    desc: "Local dev mode: Infrastructure in Docker, app services local with hot-reload (Press Ctrl+C to quit)"
    deps: [services:up]
    cmds:
      - cmd: echo "🚀 Starting Photo Explorer in local development mode..."
        silent: true
      - cmd: echo "📦 Infrastructure (Postgres, Qdrant, Redis) running in Docker"
        silent: true
      - cmd: echo "💻 Backend, Frontend, Worker running locally with hot-reload"
        silent: true
      - cmd: echo ""
        silent: true
      - cmd: echo "🔧 Running startup tasks (migrations, Qdrant collections)..."
        silent: true
      - cmd: cd backend && ../scripts/startup-local.sh
      - cmd: echo "📊 View logs below (color-coded by service):"
        silent: true
      - cmd: echo "   🔵 backend  - API server on http://localhost:8000"
        silent: true
      - cmd: echo "   🟢 frontend - Web UI on http://localhost:5173"
        silent: true
      - cmd: echo "   🟡 worker   - Background task processor"
        silent: true
      - cmd: echo ""
        silent: true
      - cmd: echo "⌨️  Press Ctrl+C to stop all services"
        silent: true
      - cmd: echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        silent: true
      - cmd: echo ""
        silent: true
      - overmind start -f Procfile.dev

  # ===================
  # Infrastructure
  # ===================

  services:up:
    desc: Start infrastructure services (Postgres, Qdrant, Redis)
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d postgres qdrant redis"

  services:down:
    desc: Stop infrastructure services
    cmds:
      - "{{.DOCKER_COMPOSE}} down"

  services:logs:
    desc: View logs from infrastructure services
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f postgres qdrant redis"

  services:clean:
    desc: Stop services and remove volumes
    cmds:
      - "{{.DOCKER_COMPOSE}} down -v"

  # ===================
  # Docker Development
  # ===================

  docker:up:
    desc: Start all services with Docker (full stack)
    cmds:
      - "{{.DOCKER_COMPOSE}} up"

  docker:up:detached:
    desc: Start all services in background
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d"

  docker:down:
    desc: Stop all Docker services
    cmds:
      - "{{.DOCKER_COMPOSE}} down"

  docker:logs:
    desc: View all Docker logs
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f"

  docker:rebuild:
    desc: Rebuild and restart services (checks for base image first)
    cmds:
      - task: docker:rebuild:check-base
      - cmd: 'echo "🔨 Rebuilding services (backend, worker, frontend)..."'
        silent: true
      - "{{.DOCKER_COMPOSE}} up -d --build --force-recreate backend worker frontend"
      - cmd: 'echo "✅ Services rebuilt successfully"'
        silent: true

  docker:rebuild:check-base:
    desc: Check if base image exists, build if missing
    internal: true
    cmds:
      - |
        if {{.DOCKER}} images photo-explorer-base:latest --format "{{{{.Repository}}}" | grep -q "photo-explorer-base"; then
          echo "✓ Base image exists, skipping base rebuild"
        else
          echo "⚠️  Base image not found, building it first..."
          echo "   This may take 10-15 minutes (only needed once)"
          task docker:rebuild:base
        fi

  docker:rebuild:base:
    desc: Rebuild the base image (includes all dependencies and ML models)
    cmds:
      - cmd: 'echo "🏗️  Building base image with all dependencies..."'
        silent: true
      - cmd: 'echo "   This includes: Python 3.12, Poetry, PyTorch, CLIP, InsightFace"'
        silent: true
      - cmd: 'echo "   Expected time: 10-15 minutes"'
        silent: true
      - cmd: echo ""
        silent: true
      - cd backend && {{.DOCKER}} build -f Dockerfile.base -t photo-explorer-base:latest .
      - cmd: echo ""
        silent: true
      - cmd: 'echo "✅ Base image built successfully"'
        silent: true
      - cmd: 'echo "   Future rebuilds will be much faster (30-60 seconds)"'
        silent: true

  # ===================
  # Testing
  # ===================

  test:
    desc: Run all tests
    cmds:
      - task: backend:test
      - task: frontend:test

  test:watch:
    desc: Run tests in watch mode
    deps:
      - backend:test:watch
      - frontend:test:watch

  test:e2e:
    desc: Run end-to-end tests
    deps: [docker:up:detached]
    cmds:
      - task: frontend:test:e2e

  test:coverage:
    desc: Run tests with coverage reports
    cmds:
      - task: backend:test:coverage
      - task: frontend:test:coverage

  # ===================
  # Setup
  # ===================

  setup:
    desc: Initial project setup
    cmds:
      - task: backend:setup
      - task: frontend:setup
      - echo "Setup complete! Run 'task dev' to start development."

  setup:backend:
    desc: Setup backend only
    cmds:
      - task: backend:setup

  setup:frontend:
    desc: Setup frontend only
    cmds:
      - task: frontend:setup

  setup:example:docker:
    desc: Setup with example photos (Docker mode - starts all services)
    cmds:
      - cmd: echo "🎬 Starting Docker services with example photos..."
        silent: true
      - task: docker:up:detached
      - task: setup:example:wait:docker
      - task: setup:example:migrate:docker
      - task: setup:example:download
      - task: setup:example:connector:docker
      - task: setup:example:index
      - task: setup:example:success

  setup:example:local:
    desc: Setup with example photos (local mode - requires running services)
    cmds:
      - cmd: echo "🎬 Setting up example photos (local dev mode)..."
        silent: true
      - task: setup:example:wait:local
      - task: setup:example:migrate:local
      - task: setup:example:download
      - task: setup:example:connector:local
      - task: setup:example:index
      - task: setup:example:success

  setup:example:success:
    desc: Display success message
    internal: true
    cmds:
      - cmd: echo ""
        silent: true
      - cmd: echo "✅ Setup complete!"
        silent: true
      - cmd: echo ""
        silent: true
      - cmd: 'echo "📱 Frontend: http://localhost:5173"'
        silent: true
      - cmd: 'echo "🔌 Backend:  http://localhost:8000"'
        silent: true
      - cmd: 'echo "📚 API Docs: http://localhost:8000/docs"'
        silent: true
      - cmd: echo ""
        silent: true
      - cmd: 'echo "💡 Try searching for: cute cat, dog playing, raccoon"'
        silent: true

  setup:example:wait:docker:
    desc: Wait for Docker services to be healthy
    internal: true
    cmds:
      - cmd: echo "⏳ Waiting for Docker services to be ready..."
        silent: true
      - |
        max_retries=30
        retry_delay=2
        i=0
        while [ $i -lt $max_retries ]; do
          if {{.DOCKER_COMPOSE}} ps | grep -q "unhealthy\|starting"; then
            echo "  Waiting... ($((i+1))/$max_retries)"
            sleep $retry_delay
            i=$((i+1))
          else
            echo "✓ Docker services ready"
            exit 0
          fi
        done
        echo "❌ Docker services failed to become healthy"
        {{.DOCKER_COMPOSE}} ps
        exit 1

  setup:example:wait:local:
    desc: Wait for local services to be ready
    internal: true
    cmds:
      - cmd: echo "⏳ Waiting for local services to be ready..."
        silent: true
      - |
        max_retries=30
        retry_delay=2
        i=0
        while [ $i -lt $max_retries ]; do
          if curl -s http://localhost:8000/health >/dev/null 2>&1; then
            echo "✓ Backend is ready"
            exit 0
          else
            echo "  Waiting for backend... ($((i+1))/$max_retries)"
            sleep $retry_delay
            i=$((i+1))
          fi
        done
        echo "❌ Backend failed to start. Is 'task dev:local' running?"
        exit 1

  setup:example:migrate:docker:
    desc: Run database migrations (Docker)
    internal: true
    cmds:
      - cmd: echo "📊 Running database migrations (Docker)..."
        silent: true
      - "{{.DOCKER_COMPOSE}} exec -T backend alembic upgrade head"
      - cmd: echo "✓ Migrations complete"
        silent: true

  setup:example:migrate:local:
    desc: Run database migrations (local)
    internal: true
    cmds:
      - cmd: echo "📊 Running database migrations (local)..."
        silent: true
      - cd backend && poetry run alembic upgrade head
      - cmd: echo "✓ Migrations complete"
        silent: true

  setup:example:download:
    desc: Download example photos
    internal: true
    cmds:
      - cmd: echo "📸 Downloading example photos..."
        silent: true
      - |
        if [ -d "backend/tests/fixtures/images" ] && [ -n "$(ls -A backend/tests/fixtures/images 2>/dev/null)" ]; then
          echo "  Example photos already exist, skipping download"
        else
          cd backend && python tests/fixtures/download_test_images.py
        fi
      - cmd: echo "✓ Example photos ready (20 images)"
        silent: true

  setup:example:connector:docker:
    desc: Create example connector (Docker path)
    internal: true
    cmds:
      - cmd: echo "🔌 Creating example connector (Docker)..."
        silent: true
      - |
        connector_id=$(curl -s -X POST http://localhost:8000/api/v1/connectors/local \
          -H "Content-Type: application/json" \
          -d '{
            "path": "/app/tests/fixtures/images",
            "name": "Example Photos",
            "recursive": true,
            "watch": false,
            "auto_album": false
          }' | jq -r '.data.id' 2>/dev/null)

        if [ -z "$connector_id" ] || [ "$connector_id" = "null" ]; then
          echo "⚠️  Connector may already exist, continuing..."
        else
          echo "✓ Connector created: $connector_id"
          echo "$connector_id" > .example-connector-id
        fi

  setup:example:connector:local:
    desc: Create example connector (local path)
    internal: true
    cmds:
      - cmd: echo "🔌 Creating example connector (local)..."
        silent: true
      - |
        # Get absolute path to images directory
        images_path=$(cd backend/tests/fixtures/images 2>/dev/null && pwd || echo "")

        if [ -z "$images_path" ]; then
          echo "❌ Images directory not found. Run download task first."
          exit 1
        fi

        connector_id=$(curl -s -X POST http://localhost:8000/api/v1/connectors/local \
          -H "Content-Type: application/json" \
          -d "{
            \"path\": \"$images_path\",
            \"name\": \"Example Photos\",
            \"recursive\": true,
            \"watch\": false,
            \"auto_album\": false
          }" | jq -r '.data.id' 2>/dev/null)

        if [ -z "$connector_id" ] || [ "$connector_id" = "null" ]; then
          echo "⚠️  Connector may already exist, continuing..."
        else
          echo "✓ Connector created: $connector_id"
          echo "$connector_id" > .example-connector-id
        fi

  setup:example:index:
    desc: Index example photos
    internal: true
    cmds:
      - cmd: echo "🔍 Indexing photos..."
        silent: true
      - |
        if [ -f .example-connector-id ]; then
          connector_id=$(cat .example-connector-id)
        else
          # Try to find existing example connector
          connector_id=$(curl -s http://localhost:8000/api/v1/connectors | jq -r '.data.connectors[] | select(.name == "Example Photos") | .id' | head -1)
        fi

        if [ -z "$connector_id" ] || [ "$connector_id" = "null" ]; then
          echo "❌ No connector found. Please check API logs."
          exit 1
        fi

        response=$(curl -s -X POST http://localhost:8000/api/v1/connectors/$connector_id/sync)
        if echo "$response" | jq -e '.success' >/dev/null 2>&1; then
          task_id=$(echo "$response" | jq -r '.data.task_id')
          echo "✓ Indexing started (task: $task_id)"
          echo "  Photos are being processed in the background..."
        else
          echo "❌ Failed to trigger indexing"
          echo "$response"
          exit 1
        fi

  # ===================
  # Database
  # ===================

  db:migrate:
    desc: Run database migrations
    cmds:
      - task: backend:db:migrate

  db:seed:
    desc: Seed database with sample data
    cmds:
      - task: backend:db:seed

  db:reset:
    desc: Reset database (drop, create, migrate, seed)
    cmds:
      - task: backend:db:reset

  # ===================
  # Code Quality
  # ===================

  lint:
    desc: Run linters for all code
    cmds:
      - task: backend:lint
      - task: frontend:lint

  format:
    desc: Format all code
    cmds:
      - task: backend:format
      - task: frontend:format

  check:
    desc: Run all checks (lint, typecheck, test)
    cmds:
      - task: lint
      - task: backend:typecheck
      - task: frontend:typecheck
      - task: test

  # ===================
  # Utilities
  # ===================

  clean:
    desc: Clean build artifacts and caches
    cmds:
      - task: backend:clean
      - task: frontend:clean

  logs:
    desc: View all logs (requires running services)
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f"

  # ===================
  # AI Models
  # ===================

  models:setup:
    desc: Download and setup all required AI models
    cmds:
      - task: backend:models:setup

  models:status:
    desc: Check status of downloaded models
    cmds:
      - task: backend:models:status

  models:list:
    desc: List available models for download
    cmds:
      - task: backend:models:list

  models:download:
    desc: Download all configured models
    cmds:
      - task: backend:models:download
